###############################################################################
# External Media Player - optional carousel screen (base id 11, carousel name "ext")
# Controls any external media player via HA button entities - HASS.agent, Kodi,
# a TV, Hi-Fi amp, or anything that exposes transport + volume as HA buttons.
# Knob = volume up/down. Buttons: prev / play-pause / next / mute.
#
# Setup steps:
#   1. Add these substitutions to guition-va.yaml:
#        ext_name:            "PC"           # label shown on the screen header
#        ext_play_entity:     button.your_play_pause
#        ext_prev_entity:     button.your_previous_track
#        ext_next_entity:     button.your_next_track
#        ext_mute_entity:     button.your_mute
#        ext_vol_up_entity:   button.your_volume_up
#        ext_vol_down_entity: button.your_volume_down
#        ext_volume_entity:   media_player.your_device   # optional: read-only, for the volume arc
#                                                          # (any entity with a volume_level attribute)
#
#   2. Add this file to the packages files: list in guition-va.yaml:
#        - base/screens/ext-media-player.yaml
#
#   3. Add "ext" to screen_order in guition-va.yaml:
#        screen_order: "clock,player,timer,ext,cars,space,weather,demo"
#
#   4. Add "ext" to the carousel token map in base/core.yaml:
#        else if (tok == "ext") id = 11;
#      (add this after the "knobuss" line)
###############################################################################

esphome:
  on_boot:
    - priority: 645
      then:
        - lambda: 'id(g_present)[11] = true;'   # register in carousel

globals:
  - id: g_ext_knob_last    # last knob delta value we handled
    type: int
    restore_value: no
    initial_value: '0'
  - id: g_ext_vol_known    # true once ext_volume_entity has pushed a real value (gates the overlay)
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: g_ext_playing    # true when ext_volume_entity's state == "playing" (drives the equalizer bars)
    type: bool
    restore_value: no
    initial_value: 'false'

script:
  - id: ext_vol_up
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: "${ext_vol_up_entity}"
  - id: ext_vol_down
    then:
      - homeassistant.action:
          action: button.press
          data:
            entity_id: "${ext_vol_down_entity}"
  # Volume overlay for THIS screen only (amber, vs. the core's teal one for the puck's own
  # speaker) - shown for ~2s on each knob detent, same restart-timer pattern as core's flash_volume.
  - id: ext_flash_volume
    mode: restart
    then:
      # Skip entirely until ext_volume_entity has pushed at least one real value - otherwise
      # this would flash a static, meaningless "50%" on every knob turn.
      - if:
          condition: { lambda: 'return id(g_ext_vol_known);' }
          then:
            - lvgl.widget.hide: ext_hint_lbl
            - lvgl.widget.show: ext_vol_dim
            - lvgl.widget.show: ext_vol_arc
            - lvgl.widget.show: ext_vol_label
            - delay: 2000ms
            - lvgl.widget.hide: ext_vol_dim
            - lvgl.widget.hide: ext_vol_arc
            - lvgl.widget.hide: ext_vol_label
            - lvgl.widget.show: ext_hint_lbl

# Volume readback (optional): ${ext_volume_entity} is read-only, separate from the six
# button entities above which only ever get pressed, never queried. Leave the substitution
# at its unused default and this sensor just stays "unavailable" - arc/label never update.
sensor:
  - platform: homeassistant
    id: ext_vol_sensor
    entity_id: ${ext_volume_entity}
    attribute: volume_level
    on_value:
      - lambda: 'id(g_ext_vol_known) = true;'
      - lvgl.arc.update:
          id: ext_vol_arc
          value: !lambda 'return x * 100.0;'
      - lvgl.label.update:
          id: ext_vol_label
          text: !lambda |-
            char buf[8]; snprintf(buf, sizeof(buf), "%d%%", (int) roundf(x * 100.0f)); return std::string(buf);

# Mute-state readback (same optional entity again) - toggles the mute button's icon between
# LV_SYMBOL_MUTE (speaker+X) and LV_SYMBOL_VOLUME_MAX (speaker+waves), same idea as play/pause.
binary_sensor:
  - platform: homeassistant
    id: ext_mute_sensor
    entity_id: ${ext_volume_entity}
    attribute: is_volume_muted
    on_state:
      - lvgl.label.update:
          id: ext_lbl_mute
          text: !lambda 'return x ? std::string("") : std::string("");'

# Playback state readback (same optional entity as the volume sensor above) - drives the
# 3-bar equalizer in the header: animates while "playing", sits flat otherwise.
text_sensor:
  - platform: homeassistant
    id: ext_state_sensor
    entity_id: ${ext_volume_entity}
    on_value:
      - lambda: 'id(g_ext_playing) = (x == "playing");'
      - lvgl.label.update:
          id: ext_lbl_play
          text: !lambda 'return id(g_ext_playing) ? std::string("") : std::string("");'
      - if:
          condition: { lambda: 'return x != "playing";' }
          then:
            - lvgl.bar.update: { id: ext_eq_bar1, value: 15, animated: false }
            - lvgl.bar.update: { id: ext_eq_bar2, value: 15, animated: false }
            - lvgl.bar.update: { id: ext_eq_bar3, value: 15, animated: false }

interval:
  # Carousel navigation: show this page when selected in the carousel
  - interval: 50ms
    then:
      - if:
          condition: { lambda: 'return id(g_nav_req) && id(g_base)==11;' }
          then:
            - lambda: |-
                id(g_nav_req) = false;
                id(g_knob_delta) = 0;                // reset delta on entry
                id(g_ext_knob_last) = 0;
                id(g_knob_capture) = true;            // capture knob for external volume
            - if: { condition: { lambda: 'return id(g_nav_anim)==0;' }, then: [lvgl.page.show: { id: page_ext, animation: move_left,   time: 250ms }] }
            - if: { condition: { lambda: 'return id(g_nav_anim)==1;' }, then: [lvgl.page.show: { id: page_ext, animation: move_right,  time: 250ms }] }
            - if: { condition: { lambda: 'return id(g_nav_anim)==2;' }, then: [lvgl.page.show: { id: page_ext, animation: move_top,    time: 250ms }] }
            - if: { condition: { lambda: 'return id(g_nav_anim)==3;' }, then: [lvgl.page.show: { id: page_ext, animation: move_bottom, time: 250ms }] }

  # Knob handling: 80ms poll (same cadence as demo screen). Capture release on leaving this
  # screen is core's job (it clears g_knob_capture on every swipe, before show_base runs) -
  # doing it here too used to clobber OTHER screens: this ran on every tick regardless of
  # which screen was active, so a screen that sets capture once on entry and never re-asserts
  # it (weather, thermostat) would silently lose it ~80ms after arriving, falling through to
  # plain volume control. Games are immune because they re-assert capture every tick themselves.
  - interval: 80ms
    then:
      # Volume up (knob turned right)
      - if:
          condition: { lambda: 'return id(g_base)==11 && id(g_knob_delta) > id(g_ext_knob_last);' }
          then:
            - lambda: 'id(g_ext_knob_last) = id(g_knob_delta);'
            - script.execute: ext_vol_up
            - script.execute: ext_flash_volume
      # Volume down (knob turned left)
      - if:
          condition: { lambda: 'return id(g_base)==11 && id(g_knob_delta) < id(g_ext_knob_last);' }
          then:
            - lambda: 'id(g_ext_knob_last) = id(g_knob_delta);'
            - script.execute: ext_vol_down
            - script.execute: ext_flash_volume

  # Equalizer animation: only while this screen is showing AND the device is playing.
  # A genuine random jump per bar per tick, not a formula - the previous "(millis()/97) % 70"
  # looked like a deterministic-jitter shortcut but was actually a slow ramp: a full cycle
  # took 70*97 = 6790ms (9.2s / 11.4s for the other two bars), i.e. bars crept up and down
  # over several seconds instead of jittering. animated: false still matters (LVGL bars
  # animate value changes by default, ~300ms tween) so a fast tick doesn't stutter.
  - interval: 150ms
    then:
      - if:
          condition: { lambda: 'return id(g_base)==11 && id(g_ext_playing);' }
          then:
            - lvgl.bar.update: { id: ext_eq_bar1, value: !lambda 'return 20 + (rand() % 70);', animated: false }
            - lvgl.bar.update: { id: ext_eq_bar2, value: !lambda 'return 20 + (rand() % 70);', animated: false }
            - lvgl.bar.update: { id: ext_eq_bar3, value: !lambda 'return 20 + (rand() % 70);', animated: false }

lvgl:
  pages:
    - id: page_ext
      bg_color: 0x000000
      widgets:
        # Outer ring for depth (matches other screens)
        - obj:
            align: CENTER
            width: 340
            height: 340
            radius: 170
            bg_opa: TRANSP
            border_width: 2
            border_color: 0x1A1F2A
            border_opa: 70%
            clickable: false
            scrollable: false

        # Dim scrim (same as player screen for visual consistency)
        - obj:
            align: CENTER
            width: 360
            height: 360
            radius: 0
            border_width: 0
            bg_color: 0x000000
            bg_opa: 42%

        # Screen header: equalizer (3 bars, animates while playing) + device name.
        # Without ext_volume_entity set, bars just sit at their static default height.
        - bar:
            id: ext_eq_bar1
            align: CENTER
            x: -14
            y: -88
            width: 6
            height: 22
            min_value: 0
            max_value: 100
            value: 15
            border_width: 0
            bg_color: 0x1A2A28
            indicator:
              bg_color: 0x2FE6CF
        - bar:
            id: ext_eq_bar2
            align: CENTER
            x: 0
            y: -88
            width: 6
            height: 22
            min_value: 0
            max_value: 100
            value: 45
            border_width: 0
            bg_color: 0x1A2A28
            indicator:
              bg_color: 0x2FE6CF
        - bar:
            id: ext_eq_bar3
            align: CENTER
            x: 14
            y: -88
            width: 6
            height: 22
            min_value: 0
            max_value: 100
            value: 30
            border_width: 0
            bg_color: 0x1A2A28
            indicator:
              bg_color: 0x2FE6CF
        - label:
            id: ext_lbl_name
            align: CENTER
            y: -130
            text: "${ext_name}"
            text_font: font_med
            text_color: 0x9FC7BE

        # Knob hint at the bottom - hidden while the volume overlay shows (same slot, swapped
        # for the % readout - no point telling you to turn the knob while you're doing it)
        - label:
            id: ext_hint_lbl
            align: CENTER
            y: 130
            text: "Turn knob for volume"
            text_font: font_artist
            text_color: 0x3A4450

        # --- Transport buttons (same layout and style as player screen) ---

        # Previous track
        - button:
            id: ext_btn_prev
            align: CENTER
            x: -84
            y: 6
            width: 50
            height: 50
            radius: 25
            bg_color: 0x223230
            bg_opa: COVER
            border_width: 0
            on_click:
              - homeassistant.action:
                  action: button.press
                  data: { entity_id: "${ext_prev_entity}" }
            widgets:
              - label: { align: CENTER, text: "", text_font: montserrat_22, text_color: 0xCFEAE4 }

        # Play / Pause (large central button)
        - button:
            id: ext_btn_play
            align: CENTER
            x: 0
            y: 6
            width: 74
            height: 74
            radius: 37
            bg_color: 0x2FE6CF
            bg_opa: COVER
            border_width: 0
            on_click:
              - homeassistant.action:
                  action: button.press
                  data: { entity_id: "${ext_play_entity}" }
            widgets:
              - label: { id: ext_lbl_play, align: CENTER, text: "", text_font: montserrat_28, text_color: 0x06201C }

        # Next track
        - button:
            id: ext_btn_next
            align: CENTER
            x: 84
            y: 6
            width: 50
            height: 50
            radius: 25
            bg_color: 0x223230
            bg_opa: COVER
            border_width: 0
            on_click:
              - homeassistant.action:
                  action: button.press
                  data: { entity_id: "${ext_next_entity}" }
            widgets:
              - label: { align: CENTER, text: "", text_font: montserrat_22, text_color: 0xCFEAE4 }

        # Mute (below transport row, red accent)
        - button:
            id: ext_btn_mute
            align: CENTER
            x: 0
            y: 82
            width: 50
            height: 50
            radius: 25
            bg_color: 0x2A1010
            bg_opa: COVER
            border_width: 1
            border_color: 0x5A2020
            on_click:
              - homeassistant.action:
                  action: button.press
                  data: { entity_id: "${ext_mute_entity}" }
            widgets:
              - label: { id: ext_lbl_mute, align: CENTER, text: "", text_font: montserrat_22, text_color: 0xFF6B60 }

        # Volume overlay (amber - distinct from the core's teal one for the puck's own speaker).
        # Hidden by default; ext_flash_volume shows it for ~2s on each knob detent. Needs
        # ext_volume_entity set to update the value - otherwise it just never has anything to show.
        # Dim scrim under the arc/label for contrast (core's overlay has the same under vol_arc).
        - obj:
            id: ext_vol_dim
            align: CENTER
            width: 360
            height: 360
            radius: 0
            border_width: 0
            bg_color: 0x000000
            bg_opa: 55%
            hidden: true
        - arc:
            id: ext_vol_arc
            align: CENTER
            width: 350
            height: 350
            arc_width: 8
            min_value: 0
            max_value: 100
            value: 50
            start_angle: 135
            end_angle: 45
            adjustable: false
            hidden: true
            arc_color: 0x4A3510
            indicator:
              arc_color: 0xF5B83D
              arc_width: 8
        # Same slot as the knob hint below (ext_hint_lbl) - flash script swaps one for the
        # other instead of stacking them, since the header (name label) is already taken.
        - label:
            id: ext_vol_label
            align: CENTER
            y: 130
            hidden: true
            text: "50%"
            text_color: 0xFFD27A
            text_font: montserrat_20
